openapi: 3.2.0
info:
  title: Fortify Software Security Center File Tokens API
  description: REST API for the on-premise Fortify Software Security Center (SSC), which provides centralized management and reporting of security assessment data across an organization's application portfolio. Enables managing projects, application versions, issues, artifacts, reports, users, and authentication tokens. The SSC REST API uses token-based authentication via the FortifyToken authorization header.
  version: v1
  contact:
    name: OpenText Fortify Support
    url: https://www.opentext.com/support
    email: fortify-support@microfocus.com
  license:
    name: Proprietary
    url: https://www.opentext.com/about/legal/website-terms-of-use
  x-logo:
    url: https://www.microfocus.com/brand/fortify-logo.png
servers:
- url: '{protocol}://{host}/ssc/api/v1'
  description: Fortify SSC Server
  variables:
    protocol:
      default: https
      enum:
      - https
      - http
    host:
      default: localhost
      description: Your SSC server hostname and optional port
security:
- fortifyToken: []
tags:
- name: File Tokens
  description: Manage file transfer tokens
paths:
  /fileTokens:
    post:
      operationId: createFileToken
      summary: Fortify Create file token
      description: Creates a single-use file transfer token for uploading or downloading artifacts.
      tags:
      - File Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileTokenRequest'
      responses:
        '201':
          description: File token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultFileToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ApiResultFileToken:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FileToken'
        count:
          type: integer
          format: int32
        responseCode:
          type: integer
          format: int32
    ErrorResponse:
      type: object
      description: Error response
      properties:
        errorCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: object
    FileToken:
      type: object
      description: A single-use file transfer token
      properties:
        token:
          type: string
          description: Token value
        fileTokenType:
          type: string
          description: Token type
          enum:
          - UPLOAD
          - DOWNLOAD
          - REPORT_FILE
    CreateFileTokenRequest:
      type: object
      required:
      - fileTokenType
      properties:
        fileTokenType:
          type: string
          enum:
          - UPLOAD
          - DOWNLOAD
          - REPORT_FILE
  responses:
    Unauthorized:
      description: Unauthorized - authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    fortifyToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Fortify token-based authentication. Pass as: FortifyToken <token_value>. Obtain a token via POST /api/v1/tokens with HTTP Basic credentials.'
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication. Only supported on the /tokens endpoint for obtaining API tokens.
externalDocs:
  description: Fortify Software Security Center Documentation
  url: https://www.microfocus.com/documentation/fortify-software-security-center/
